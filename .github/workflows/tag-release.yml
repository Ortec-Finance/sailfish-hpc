name: Tag release
on:
  push:
    branches:
      - main
jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump version and push tag
        id: tag_version
        uses: RomainEndelin/github-tag-action@d6d4c3e86ae18c98852973a7e5c59fffc6576b56 # v1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          force_bump: minor
      - name: Extract changelog
        id: extract-changelog
        uses: sean0x42/markdown-extract@c693bde0b70a7056f5d698fc961e92c101bec53f
        with:
          file: "CHANGELOG.md"
          no-print-matched-heading: true
          pattern: "${{ steps.tag_version.outputs.new_tag }}"
      - name: Create a GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.extract-changelog.outputs.markdown }}
